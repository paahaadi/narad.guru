[project]
name = "narad-intelligence"
version = "0.1.0"
description = "NARAD V2 Intelligence Plane — FastAPI + Celery backend"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.0",
    "google-generativeai>=0.8.0",
    "httptools>=0.6.0",
    "httpx>=0.28.0",
    "json-logic-qubit>=0.3.0",
    "orjson>=3.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "uvloop>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "factory-boy>=3.3.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
