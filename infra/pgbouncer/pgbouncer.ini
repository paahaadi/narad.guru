[databases]
narad_v2 = host=postgres port=5432 dbname=narad_v2

[pgbouncer]
pool_mode = transaction
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
max_client_conn = 200
default_pool_size = 20
server_idle_timeout = 600
idle_transaction_timeout = 30
query_timeout = 30
log_connections = 1
log_disconnections = 1
